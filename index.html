<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司座位配置系統</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="page-header">
        <h1>公司座位配置系統</h1>
        <div id="toolbar">
            <ul>
                <li><button type="button" class="toolbar-button" id="edit-seat-button">編輯座位</button></li>
                <li><button type="button" class="toolbar-button" id="assign-employee-button">安排人員</button></li>
                <li><button type="button" class="toolbar-button" id="normal-view-button">一般檢視</button></li>
                <li><button type="button" class="toolbar-button" id="department-view-button">部門檢視</button></li>
                <li><button type="button" class="toolbar-button" id="save-layout-button">儲存配置</button></li>
            </ul>
        </div>
    </header>

    <main class="seat-map-layout">
        <!-- 員工清單、搜尋功能 -->
        <aside class="employee-panel">
            <h2>待安排員工</h2>


            <ul id="employee-list">

                <li class="employee-item" draggable="true">
                    <span class="employee-name">王小明</span>
                    <span class="employee-department">管理處</span>
                    <span class="employee-role">人資</span>
                    <span class="employee-extension">分機：440</span>
                </li>
                <li class="employee-item" draggable="true">
                    <span class="employee-name">李大華</span>
                    <span class="employee-department">品質與技術服務處</span>
                    <span class="employee-role">測試工程師</span>
                    <span class="employee-extension">分機：441</span>
                </li>
                <li class="employee-item" draggable="true">
                    <span class="employee-name">張美玲</span>
                    <span class="employee-department">產品發展處</span>
                    <span class="employee-role">前端工程師</span>
                    <span class="employee-extension">分機：442</span>
                </li>

            </ul>

        </aside>

        <!-- 平面圖、固定座位 -->
        <section class="seat-map-panel">
            <h2>公司座位表</h2>

            <div class="floor-plan-viewport">
                <div id="floor-plan">
                    <div class="seat" id="seat-1">
                        <div class="seat-employee-info"></div>
                    </div>
                    <div class="seat" id="seat-2">
                        <div class="seat-employee-info"></div>
                    </div>
                    <div class="seat" id="seat-3">
                        <div class="seat-employee-info"></div>
                    </div>
                    <div class="seat" id="seat-4">
                        <div class="seat-employee-info"></div>
                    </div>
                    <div class="seat" id="seat-5">
                        <div class="seat-employee-info"></div>
                    </div>
                    <div class="seat" id="seat-6">
                        <div class="seat-employee-info"></div>
                    </div>
                </div>
            </div>


            <h3>部門顏色圖例</h3>

            <ul id="department-legend">

                <li class="department-legend-item"><span class="color-swatch management-color"></span>管理處</li>
                <li class="department-legend-item"><span class="color-swatch quality-service-color"></span>品質與技術服務處</li>
                <li class="department-legend-item"><span class="color-swatch product-development-color"></span>產品發展處
                </li>

            </ul>



        </section>

    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
