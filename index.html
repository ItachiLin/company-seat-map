<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司座位配置系統</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="page-header">
        <h1>公司座位配置系統</h1>
        <div id="toolbar">
            <ul>
                <li><button type="button" class="toolbar-button" id="edit-seat-button">編輯座位</button></li>
                <li><button type="button" class="toolbar-button" id="add-seat-button">新增座位</button></li>
                <li><button type="button" class="toolbar-button" id="delete-seat-button">刪除座位</button></li>
                <li><button type="button" class="toolbar-button" id="unassign-employee-button">解除安排</button></li>
                <li><button type="button" class="toolbar-button" id="normal-view-button">一般檢視</button></li>
                <li><button type="button" class="toolbar-button" id="department-view-button">部門檢視</button></li>
                <li><span id="save-status">儲存狀態：尚未儲存</span></li>
            </ul>
        </div>
    </header>

    <main class="seat-map-layout">
        <!-- 員工清單、搜尋功能 -->
        <aside class="employee-panel">
            <h2>待安排員工</h2>
            <label for="add-employee-name">姓名</label>
            <input type="text" id="add-employee-name">
            <label for="add-employee-department">部門</label>
            <input type="text" id="add-employee-department" list="department-options">
            <datalist id="department-options"></datalist>
            <label for="add-employee-role">職務</label>
            <input type="text" id="add-employee-role">
            <label for="add-employee-extension">分機</label>
            <input type="text" id="add-employee-extension">
            <button type="button" id="add-employee-button">新增員工</button>


            <ul id="employee-list">



            </ul>

        </aside>

        <!-- 平面圖、固定座位 -->
        <section class="seat-map-panel">
            <h2>公司座位表</h2>


            <div class="floor-plan-viewport">
                <div id="floor-plan">
                    
                </div>
            </div>


            <h3>部門顏色圖例</h3>

            <ul id="department-legend">


            </ul>



        </section>

    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
